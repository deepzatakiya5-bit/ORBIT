<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ORBIT — Dev UI</title>
  <style>
    :root {
      --bg: #0b0d12;
      --surface: #141820;
      --surface2: #1c2230;
      --border: #2a3344;
      --text: #e8ecf4;
      --muted: #8b95a8;
      --accent: #6c8cff;
      --accent-dim: #4a64c4;
      --success: #3dd68c;
      --error: #ff6b7a;
      --user-bubble: #243049;
      --orbit-bubble: #1a2438;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }
    header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      background: var(--surface);
    }
    header h1 { font-size: 1.25rem; font-weight: 600; letter-spacing: 0.02em; }
    header h1 span { color: var(--accent); }
    .status-pills { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .pill {
      font-size: 0.75rem;
      padding: 0.25rem 0.6rem;
      border-radius: 999px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .pill.ok { color: var(--success); border-color: #2a5c44; }
    .pill.bad { color: var(--error); border-color: #5c2a34; }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 1.5rem;
    }
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      margin-bottom: 1rem;
    }
    .panel h2 {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 1rem;
    }
    label {
      display: block;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 0.25rem;
      margin-top: 0.75rem;
    }
    label:first-child { margin-top: 0; }
    input, select, textarea {
      width: 100%;
      padding: 0.55rem 0.75rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      font-size: 0.95rem;
    }
    textarea { min-height: 80px; resize: vertical; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    @media (max-width: 520px) { .row { grid-template-columns: 1fr; } }
    .checks { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.5rem; }
    .checks label {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      margin: 0;
      font-size: 0.85rem;
      color: var(--text);
      cursor: pointer;
    }
    .checks input { width: auto; }
    button {
      margin-top: 1rem;
      padding: 0.6rem 1.2rem;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
    }
    button:hover { background: var(--accent-dim); }
    button.secondary {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
    }
    button.secondary:hover { border-color: var(--accent); }
    .btn-row { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1rem; }
    .btn-row button { margin-top: 0; }
    .hidden { display: none !important; }
    #chat-panel { display: flex; flex-direction: column; min-height: 420px; }
  .chat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      max-height: 360px;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      padding: 0.5rem 0;
    }
    .msg {
      max-width: 85%;
      padding: 0.65rem 0.9rem;
      border-radius: 12px;
      font-size: 0.92rem;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user {
      align-self: flex-end;
      background: var(--user-bubble);
      border-bottom-right-radius: 4px;
    }
    .msg.assistant {
      align-self: flex-start;
      background: var(--orbit-bubble);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }
    .msg .role {
      font-size: 0.65rem;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.25rem;
    }
    .chat-input {
      display: flex;
      gap: 0.5rem;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
    }
    .chat-input input { flex: 1; margin: 0; }
    .chat-input button { margin: 0; flex-shrink: 0; }
    #toast {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      padding: 0.75rem 1.25rem;
      border-radius: 8px;
      background: var(--surface2);
      border: 1px solid var(--border);
      font-size: 0.9rem;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      max-width: 90vw;
    }
    #toast.show { opacity: 1; }
    #toast.error { border-color: var(--error); color: var(--error); }
    .meta { font-size: 0.75rem; color: var(--muted); margin-top: 0.5rem; word-break: break-all; }
    .info { font-size: 0.85rem; color: var(--muted); margin-bottom: 0.75rem; }
  </style>
</head>
<body>
  <header>
    <h1><span>ORBIT</span> Dev UI</h1>
    <div class="status-pills">
      <span class="pill" id="pill-api">API …</span>
      <span class="pill" id="pill-db">DB …</span>
    </div>
  </header>

  <main>
    <section class="panel" id="setup-panel">
      <h2>Connection</h2>
      <p class="info">Served from the API — base URL defaults to this host.</p>
      <label>API base URL</label>
      <input type="url" id="api-base" placeholder="http://localhost:8080" />
      <div class="btn-row">
        <button type="button" class="secondary" id="btn-check">Check health</button>
        <button type="button" id="btn-new-user">Create new user</button>
      </div>
      <p class="meta" id="user-meta">No user yet</p>
    </section>

    <section class="panel hidden" id="onboarding-panel">
      <h2>Onboarding</h2>
      <p class="info">Complete once per user. Required before chat.</p>
      <div class="row">
        <div>
          <label>Full name *</label>
          <input type="text" id="name" placeholder="Deep Zatakiya" />
        </div>
        <div>
          <label>Nickname</label>
          <input type="text" id="nickname" placeholder="Deep" />
        </div>
      </div>
      <div class="row">
        <div>
          <label>Gender *</label>
          <select id="gender">
            <option value="male">male</option>
            <option value="female">female</option>
            <option value="non_binary">non_binary</option>
            <option value="other">other</option>
            <option value="prefer_not_to_say">prefer_not_to_say</option>
          </select>
        </div>
        <div>
          <label>Birthdate *</label>
          <input type="date" id="birthdate" />
        </div>
      </div>
      <label>Occupation *</label>
      <input type="text" id="occupation" placeholder="Software Engineer" />
      <div class="row">
        <div>
          <label>Preferred language *</label>
          <input type="text" id="preferred_language" value="en" />
        </div>
        <div>
          <label>Timezone *</label>
          <input type="text" id="timezone" value="Asia/Kolkata" placeholder="Asia/Kolkata" />
        </div>
      </div>
      <label>Communication style *</label>
      <select id="communication_style">
        <option value="warm_short">warm_short — warm & concise</option>
        <option value="warm_long">warm_long — warm & detailed</option>
        <option value="direct_short">direct_short — direct & concise</option>
        <option value="playful_short">playful_short — playful & concise</option>
      </select>
      <label>Why are you here? * (1–5)</label>
      <div class="checks" id="why-here-checks">
        <label><input type="checkbox" value="companionship" checked /> companionship</label>
        <label><input type="checkbox" value="stress_support" /> stress_support</label>
        <label><input type="checkbox" value="goals" checked /> goals</label>
        <label><input type="checkbox" value="loneliness" /> loneliness</label>
        <label><input type="checkbox" value="curiosity" /> curiosity</label>
        <label><input type="checkbox" value="self_growth" /> self_growth</label>
      </div>
      <button type="button" id="btn-onboarding">Save profile</button>
    </section>

    <section class="panel hidden" id="chat-panel">
      <div class="chat-header">
        <h2>Chat with ORBIT</h2>
        <button type="button" class="secondary" id="btn-new-conv">New conversation</button>
      </div>
      <div id="messages"></div>
      <div class="chat-input">
        <input type="text" id="message-input" placeholder="Type a message…" autocomplete="off" />
        <button type="button" id="btn-send">Send</button>
      </div>
      <p class="meta" id="conv-meta"></p>
    </section>
  </main>

  <div id="toast"></div>

  <script>
    const STORAGE_USER = 'orbit_user_id';
    const STORAGE_CONV = 'orbit_conversation_id';

    const $ = (id) => document.getElementById(id);

    function base() {
      const v = $('api-base').value.trim().replace(/\/$/, '');
      return v || window.location.origin;
    }

    function toast(msg, isError = false) {
      const el = $('toast');
      el.textContent = msg;
      el.className = 'show' + (isError ? ' error' : '');
      clearTimeout(el._t);
      el._t = setTimeout(() => { el.className = ''; }, 4000);
    }

    async function api(method, path, body) {
      const opts = { method, headers: {} };
      if (body !== undefined) {
        opts.headers['Content-Type'] = 'application/json';
        opts.body = JSON.stringify(body);
      }
      const res = await fetch(base() + path, opts);
      const text = await res.text();
      let data;
      try { data = text ? JSON.parse(text) : {}; } catch { data = { raw: text }; }
      if (!res.ok) {
        const err = new Error(data.error || res.statusText || 'Request failed');
        err.status = res.status;
        err.data = data;
        throw err;
      }
      return data;
    }

    function getUserId() { return localStorage.getItem(STORAGE_USER); }
    function setUserId(id) {
      localStorage.setItem(STORAGE_USER, id);
      $('user-meta').textContent = 'User: ' + id;
    }
    function getConvId() { return localStorage.getItem(STORAGE_CONV); }
    function setConvId(id) {
      localStorage.setItem(STORAGE_CONV, id);
      $('conv-meta').textContent = id ? 'Conversation: ' + id : '';
    }

    function showOnboarding() {
      $('onboarding-panel').classList.remove('hidden');
      $('chat-panel').classList.add('hidden');
    }
    function showChat() {
      $('onboarding-panel').classList.add('hidden');
      $('chat-panel').classList.remove('hidden');
    }

    function renderMessages(list) {
      const box = $('messages');
      box.innerHTML = '';
      (list || []).forEach((m) => {
        const div = document.createElement('div');
        div.className = 'msg ' + m.role;
        div.innerHTML = '<div class="role">' + m.role + '</div>' + escapeHtml(m.content);
        box.appendChild(div);
      });
      box.scrollTop = box.scrollHeight;
    }

    function escapeHtml(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    function getWhyHere() {
      return [...document.querySelectorAll('#why-here-checks input:checked')].map((c) => c.value);
    }

    async function checkHealth() {
      try {
        await api('GET', '/health');
        $('pill-api').textContent = 'API ok';
        $('pill-api').className = 'pill ok';
      } catch {
        $('pill-api').textContent = 'API down';
        $('pill-api').className = 'pill bad';
      }
      try {
        await api('GET', '/ready');
        $('pill-db').textContent = 'DB ok';
        $('pill-db').className = 'pill ok';
      } catch {
        $('pill-db').textContent = 'DB down';
        $('pill-db').className = 'pill bad';
      }
    }

    async function loadUser() {
      const id = getUserId();
      if (!id) {
        showOnboarding();
        $('onboarding-panel').classList.add('hidden');
        return;
      }
      try {
        const user = await api('GET', '/v1/users/' + id);
        if (user.onboarding_completed) {
          showChat();
          await ensureConversation();
        } else {
          showOnboarding();
        }
      } catch (e) {
        if (e.status === 404) {
          localStorage.removeItem(STORAGE_USER);
          localStorage.removeItem(STORAGE_CONV);
          $('user-meta').textContent = 'No user yet';
        }
        toast(e.message, true);
      }
    }

    async function createUser() {
      const user = await api('POST', '/v1/users');
      setUserId(user.id);
      localStorage.removeItem(STORAGE_CONV);
      toast('User created');
      showOnboarding();
    }

    async function submitOnboarding() {
      const id = getUserId();
      if (!id) { toast('Create a user first', true); return; }
      const body = {
        name: $('name').value.trim(),
        nickname: $('nickname').value.trim(),
        gender: $('gender').value,
        birthdate: $('birthdate').value,
        occupation: $('occupation').value.trim(),
        preferred_language: $('preferred_language').value.trim(),
        timezone: $('timezone').value.trim(),
        communication_style: $('communication_style').value,
        why_here: getWhyHere(),
      };
      if (!body.birthdate) { toast('Birthdate is required', true); return; }
      await api('PUT', '/v1/users/' + id + '/onboarding', body);
      toast('Profile saved');
      showChat();
      await startConversation();
    }

    async function startConversation() {
      const userId = getUserId();
      const data = await api('POST', '/v1/conversations', { user_id: userId });
      setConvId(data.conversation.id);
      const msgs = data.greeting ? [data.greeting] : [];
      renderMessages(msgs);
      toast('Conversation started');
    }

    async function ensureConversation() {
      const convId = getConvId();
      if (convId) {
        try {
          const data = await api('GET', '/v1/conversations/' + convId + '/messages');
          renderMessages(data.messages);
          $('conv-meta').textContent = 'Conversation: ' + convId;
          return;
        } catch {
          localStorage.removeItem(STORAGE_CONV);
        }
      }
      await startConversation();
    }

    async function sendMessage() {
      const convId = getConvId();
      const content = $('message-input').value.trim();
      if (!convId || !content) return;
      $('btn-send').disabled = true;
      try {
        const data = await api('POST', '/v1/conversations/' + convId + '/messages', { content });
        const data2 = await api('GET', '/v1/conversations/' + convId + '/messages');
        renderMessages(data2.messages);
        $('message-input').value = '';
      } catch (e) {
        toast(e.message, true);
      } finally {
        $('btn-send').disabled = false;
      }
    }

    $('api-base').value = window.location.origin;
    $('birthdate').value = '1998-05-15';

    $('btn-check').onclick = checkHealth;
    $('btn-new-user').onclick = () => createUser().catch((e) => toast(e.message, true));
    $('btn-onboarding').onclick = () => submitOnboarding().catch((e) => toast(e.message, true));
    $('btn-new-conv').onclick = () => startConversation().catch((e) => toast(e.message, true));
    $('btn-send').onclick = sendMessage;
    $('message-input').onkeydown = (e) => { if (e.key === 'Enter') sendMessage(); };

    const uid = getUserId();
    if (uid) $('user-meta').textContent = 'User: ' + uid;

    checkHealth();
    loadUser();
  </script>
</body>
</html>
